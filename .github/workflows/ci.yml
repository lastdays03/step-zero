name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Checking branch: ${BRANCH_NAME}"
          if [[ "${BRANCH_NAME}" =~ ^feature/[0-9]+-[a-z0-9-]+$ ]]; then
            exit 0
          fi
          if [[ "${BRANCH_NAME}" =~ ^hotfix/[0-9]+-[a-z0-9-]+$ ]]; then
            exit 0
          fi
          if [[ "${BRANCH_NAME}" =~ ^release/[a-z0-9.-]+$ ]]; then
            exit 0
          fi
          if [[ "${BRANCH_NAME}" == "develop" || "${BRANCH_NAME}" == "main" ]]; then
            exit 0
          fi
          echo "Invalid branch name: ${BRANCH_NAME}"
          echo "Allowed: feature/<issue>-<slug>, hotfix/<issue>-<slug>, release/<name>"
          exit 1

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
