[project]
name = "stepzero-backend"
version = "0.1.0"
description = "StepZero Backend API"
authors = [
    {name = "Tech Lead", email = "techlead@stepzero.com"},
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "sqlmodel>=0.0.14",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "pgvector>=0.2.0",
    "greenlet>=3.0.0",
    "python-multipart",
    "google-auth>=2.26.0",
    "requests>=2.31.0",
    "langchain-openai>=0.0.5",
    "langchain-core>=0.1.20",
    "langchain-community>=0.0.20",
    "langchain-postgres>=0.0.3",
    "pdfplumber>=0.10.3",
    "psycopg2-binary>=2.9.9"
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "polyfactory>=2.14.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
