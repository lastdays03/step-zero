[project]
name = "stepzero-backend"
version = "0.1.0"
description = "StepZero Backend API"
authors = [
    {name = "Tech Lead", email = "techlead@stepzero.com"},
]
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.48",
    "asyncpg>=0.29.0",
    "sqlmodel>=0.0.37",
    "pydantic-settings>=2.1.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "redis>=5.0.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "pgvector>=0.2.0",
    "greenlet>=3.0.0",
    "python-multipart",
    "google-auth>=2.26.0",
    "requests>=2.31.0",
    "langchain-openai>=0.0.5",
    "langchain-core>=0.1.20",
    "langchain-community>=0.0.20",
    "langchain-postgres>=0.0.3",
    "pdfplumber>=0.10.3",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.2",
    "arq>=0.25.0",
    "numpy>=1.26.0",
    "slowapi>=0.1.9",
    "boto3>=1.42.61",
]
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.20.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "polyfactory>=2.14.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--ignore=tests/eval"
cache_dir = ".temp/artifacts/pytest-cache"
filterwarnings = [
    'error:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning',
    "error:coroutine 'AsyncMockMixin\\._execute_mock_call' was never awaited:RuntimeWarning",
]
markers = [
    "requires_openai: tests that require OPENAI_API_KEY to be set",
    "eval: RAG evaluation tests (expensive, requires real OpenAI API + PostgreSQL)",
    "slow: slow-running tests",
    "full_eval: full evaluation suite (tier 3)",
]
